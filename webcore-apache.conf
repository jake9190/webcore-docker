# webCoRE dashboard - Apache virtual host (plain HTTP on :80)
#
# SSL is terminated upstream (reverse proxy / load balancer), so this container
# only serves HTTP. Serves the (unminified) dashboard/ folder directly -
# "option #1", no dist build required.
#
# The dashboard is an AngularJS HTML5-mode single-page app with <base href="/">,
# so it MUST be served from the site root. Deep links / page refreshes are
# handled by dashboard/.htaccess (it rewrites anything that isn't a real file or
# directory to /index.html). That requires "AllowOverride All" + mod_rewrite.

ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/webcore

    <Directory /var/www/webcore>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The dashboard's html/js/css are unversioned (no cache-busting query
    # string), so force browsers to revalidate them on every load. Apache still
    # serves ETag/Last-Modified, so unchanged files return a cheap 304 - but a
    # rebuilt/edited file is picked up immediately instead of being served from
    # a stale browser cache. Requires mod_headers.
    <FilesMatch "\.(?:html|js|css)$">
        Header set Cache-Control "no-cache, must-revalidate"
    </FilesMatch>

    # ---------------------------------------------------------------------
    # OPTIONAL: reverse-proxy the local Hubitat API through this origin so the
    # dashboard's "local endpoint" feature is same-origin (no CORS). Requires
    # mod_proxy + mod_proxy_http. Replace HUB_IP with your hub's LAN address,
    # then point the dashboard's local endpoint at this server.
    #
    # The Hubitat local OAuth endpoint looks like:
    #   http://HUB_IP/apps/api/<appId>/intf/dashboard/... ?access_token=...
    # so proxying /apps/ is all that is needed; it does not collide with the
    # dashboard's own /css, /js, /html, /img assets.
    # ---------------------------------------------------------------------
    #ProxyPreserveHost Off
    #ProxyPass        /apps/  http://HUB_IP/apps/
    #ProxyPassReverse /apps/  http://HUB_IP/apps/

    # Send Apache logs to the container's stdout/stderr.
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>